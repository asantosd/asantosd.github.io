cv:
  name: Alejandro Santos-Díaz, Ph.D.
  label: Assistant Professor, Mechatronics Department, Tecnológico de Monterrey
  email: alejandro.santos@tec.mx
  location: Mexico City, Mexico
  image: ""
  summary: "Biomedical engineer, MR scientist, and machine learning researcher specializing in medical imaging, magnetic resonance imaging (MRI), brain metabolism, and AI-based diagnostic systems. More than a decade of experience in pulse-sequence development, compressed sensing reconstruction, deep learning pipelines for clinical imaging, and translational applications in neurology, cardiology, and infectious disease. SNI Level I researcher, assistant professor, and former program director with an extensive publication record (15+ journal articles, 20+ conference papers) and international training at McMaster University. Active in graduate supervision and interdisciplinary collaborations in AI for healthcare."

