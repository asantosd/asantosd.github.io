  - name: Jesper Michiel Janssen
    initials: JJ
    photo: students/jesper-michiel-janssen.jpg
    role: Principal advisor
    status: In progress
    title: Speeding Up Hardware-Aware Multi-Objective Search of Tiny Neural Architectures for Medical Image Super-Resolution
    description: Designs very small deep neural networks that improve the resolution of medical images on low-power clinical hardware, where point-of-care
      computers often have under 100 MB of free memory. The project uses multi-objective evolutionary neural architecture search (HW-EMONAS) to
      balance image quality (PSNR/SSIM) against memory, FLOPs, latency and energy use. Surrogate models and zero-cost proxies cut the computational
      and carbon cost of the search. A planned protocol tests the diagnostic accuracy of the resulting models on mammograms.
- id: msc
