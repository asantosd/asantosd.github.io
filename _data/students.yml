  students:
  - name: Alejandro Garma Oehmichen
    initials: AO
    photo: students/alejandro-garma-oehmichen.jpg
    role: Co-advisor
    status: Completed 2026
    title: Análisis basado en conectomas para neuropatologías no específicas en pacientes post Covid
    description: Uses brain connectomics to study non-specific neurological and psychiatric sequelae in people who had COVID-19. With magnetic
      resonance neuroimaging, he compared structural brain networks of 100 subjects (51 post-COVID patients and 49 controls). The work focuses
      on the Mexican population, whose demographics, chronic comorbidities and genetic characteristics may shape how the disease affects the brain,
      and aims to add new knowledge about COVID-19's neurological consequences.
  - name: Jossian Abimelec García Quijano
    initials: JQ
    photo: students/jossian-abimelec-garcia-quijano.jpg
    role: Principal advisor
    status: Completed 2024
    title: Assessment of reconstruction accuracy for under-sampled 31P-MRS data using compressed sensing and a Low-Rank Hankel Matrix completion
      approach
    description: Studies how to speed up phosphorus magnetic resonance spectroscopy (31P-MRS), which measures energy metabolites in muscle and
      brain but is rarely used clinically because acquisitions are long. Using compressed sensing with Low-Rank Hankel matrix completion, experiments
      showed that reconstruction accuracy depends heavily on which samples are kept rather than on the under-sampling factor alone, and that noise
      level has an even stronger effect. A journal manuscript was prepared from this work.
  - name: Esteban Ricardo Salazar Cabrera
    initials: EC
    photo: students/esteban-ricardo-salazar-cabrera.jpg
    role: Principal advisor
    status: Completed 2024
    title: Named Entity Recognition in Mammography Radiology Reports using a Multilingual Transfer Learning Approach
    description: Evaluates BERT-based language models for named entity recognition in Spanish mammography radiology reports, extracting findings
      such as BI-RADS category, symptoms and breast tissue descriptors. Several fine-tuning strategies were compared with precision, recall and
      F1-score; fine-tuning only the last two layers reduced overfitting and generalized best. Distinctive entities approached perfect scores,
      while rare ones were harder. Accepted at CBMS 2024, with a research stay at Universidad Politécnica de Madrid.
  - name: Esteban Demián Elizondo Pereo
    initials: EP
    photo: students/esteban-demian-elizondo-pereo.jpg
    role: Principal advisor
    status: Completed 2023
    title: Assessment of Diffusion Weighted Imaging (DWI) Derived Metrics Variability for the Evaluation of White Matter Tissue Integrity
    description: 'Addresses the lack of standardization in diffusion-weighted MRI acquisition and processing, which makes white matter results
      hard to compare across studies. Using coefficients of variation, he measured how much DWI-derived metrics, including fixel-based fiber density
      and fiber cross-section, vary with acquisition and processing choices. Goals: identify optimal acquisition parameters, build an optimized
      processing pipeline, and produce a healthy-subject template for reliable comparison across protocols.'
  - name: Eri Luna López
    initials: EL
    photo: students/eri-luna-lopez.jpg
    role: Principal advisor
    status: Completed 2023
    title: 'Clinical Characterization of Metabolic Syndrome Patients Using Clustering Techniques: A Study in the Mexican Population'
    description: Applies unsupervised machine learning to metabolic syndrome, a cluster of risk factors that raises the likelihood of cardiovascular
      disease and type 2 diabetes and is highly prevalent in Mexico. Several clustering algorithms are evaluated on datasets of Mexican patients
      to discover subgroups with distinct, clinically meaningful profiles. These subgroups are then characterized clinically, supporting more
      personalized risk assessment and treatment for the Mexican population.
  - name: Daniel Vela Jarquin
    initials: DJ
    photo: students/daniel-vela-jarquin.jpg
    role: Principal advisor
    status: Completed 2023
    title: Multimodal medical image captioning with contrastive encodings
    description: Builds a system that automatically writes clinically relevant reports from medical images. Instead of single-modality captioning
      models, he proposes an encoder-decoder deep learning architecture using contrastive learning (CLIP-style pretrained encoders, MedCLIP) with
      semantic and spatial attention, so one model can caption many imaging modalities. The system is compared against state-of-the-art modality-specific
      models and introduces multilingual caption learning with English and Spanish report databases.
  - name: Sharif Nasser Kadamani
    initials: SK
    photo: students/sharif-nasser-kadamani.jpg
    role: Co-advisor
    status: Completed 2023
    title: Analysis of Data-driven Diabetes Subgroups using Machine Learning for Prediction of Glycemic Control and Complications
    description: Uses machine learning to support personalized management of type 2 diabetes. Building on data-driven diabetes subgroups, he trained
      classification models to find patterns within each subgroup and predict glycemic control, complications and treatment response from clinical
      characteristics. Done with the Metabolic Diseases Research Unit of the Instituto Nacional de Ciencias Médicas y Nutrición Salvador Zubirán
      using Mexican patient data, it aims to move diabetes care toward subgroup-tailored treatment.
  - name: Berenice Jacqueline Sánchez Alvarado
    initials: BA
    photo: students/berenice-jacqueline-sanchez-alvarado.jpg
    role: Principal advisor
    status: Completed 2022
    title: Evaluation of white matter tissue integrity from COVID-19 recovered patients using diffusion weighted imaging
    description: Investigates long-term neurological effects of COVID-19 (neurocovid) by looking for microstructural changes in the white matter
      of recovered patients. Using diffusion-weighted MRI, she analyzed tensor-based metrics such as apparent diffusion coefficient and fractional
      anisotropy, then applied fixel-based analysis and diffusion kurtosis imaging to handle crossing fibers. Statistical analyses found regional
      differences associated with intubation, comorbidities and disease severity, providing evidence of white matter alterations after COVID-19.
